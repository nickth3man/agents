<!doctype html>
<!-- asm-chat -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>asm-chat</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;font:16px/1.4 system-ui,Segoe UI,sans-serif;padding:1rem}
  h1{font-size:1.1rem;margin:0 0 .5rem}
  #build{font-size:.75rem;opacity:.6;margin-bottom:.75rem;font-family:ui-monospace,Consolas,monospace}
  #transcript{height:60vh;overflow-y:auto;border:1px solid GrayText;border-radius:4px;padding:.5rem;margin-bottom:.5rem}
  #transcript p{margin:.25rem 0;white-space:pre-wrap;word-break:break-word}
  #transcript .user{color:Highlight}
  form{display:flex;gap:.5rem}
  #msg{flex:1;padding:.4rem}
  button{padding:.4rem 1rem}
</style>
</head>
<body>
<h1>asm-chat</h1>
<div id="build">build: …</div>
<div id="transcript" aria-live="polite"></div>
<form id="f">
  <input id="msg" autocomplete="off" placeholder="Say something">
  <button type="submit">Send</button>
</form>
<script>
const $t=document.getElementById('transcript'), $b=document.getElementById('build'),
      $f=document.getElementById('f'), $m=document.getElementById('msg');
$m.focus();
function add(cls,text){
  const p=document.createElement('p'); p.className=cls;
  p.textContent=text; $t.appendChild(p); $t.scrollTop=$t.scrollHeight; // never innerHTML
}
$f.addEventListener('submit',async e=>{
  e.preventDefault();
  const text=$m.value; if(!text) return;
  add('user',text); $m.value=''; $m.focus();
  try{ const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'text/plain'},body:text});
       add('bot',await r.text());
  }catch(err){ add('bot','(connection failed — is the server rebuilding?)'); }
});
let initial=null;
function poll(){
  setTimeout(async()=>{
    try{
      const v=await (await fetch('/version',{cache:'no-store'})).text();
      if(initial===null){ initial=v; $b.textContent='build: '+v; }
      else if(v!==initial){ location.reload(); return; }   // new build → reload
    }catch(_){}                                            // server restarting → retry
    poll();                                                // recursive, ~500ms, never overlaps
  },500);
}
poll();
</script>
</body>
</html>
